# Datastore override for the standard and scalable profiles.
# Adds PostgreSQL + Redis, the Celery worker and beat, and points the backend at them
# using in-network service names, overriding any localhost values from the local .env.
#
#   docker compose -f docker-compose.yml -f docker-compose.datastores.yml \
#                  --profile standard up --build -d

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["standard", "scalable"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osnova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osnova}
      POSTGRES_DB: ${POSTGRES_DB:-osnova}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osnova}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["standard", "scalable"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      args:
        REQUIREMENTS: standard
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-osnova}:${POSTGRES_PASSWORD:-osnova}@postgres:5432/${POSTGRES_DB:-osnova}
      REDIS_URL: redis://redis:6379/0
      # Rate limits shared by every replica (RATE_LIMIT_STORAGE=memory in .env to keep
      # them in each process)
      RATE_LIMIT_STORAGE: ${RATE_LIMIT_STORAGE:-redis}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs background tasks (app/modules/tasks), e.g. sending email when
  # BACKGROUND_TASKS_ENABLED=true. Same image as the backend.
  worker:
    build:
      context: .
      args:
        REQUIREMENTS: standard
        EXTRA_REQUIREMENTS: ${EXTRA_REQUIREMENTS:-}
    profiles: ["standard", "scalable"]
    restart: unless-stopped
    command: ["celery", "-A", "app.modules.tasks.celery_app", "--quiet", "worker", "-l", "info"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-osnova}:${POSTGRES_PASSWORD:-osnova}@postgres:5432/${POSTGRES_DB:-osnova}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Migrations are the backend's job (RUN_MIGRATIONS in .env, or make migrate):
      # several processes migrating one fresh database at once fail
      RUN_MIGRATIONS: "false"
    # The image health check calls the HTTP API, which the worker does not serve
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.modules.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  # Sends scheduled tasks (beat_schedule in app/modules/tasks/celery_app.py) to the
  # worker. Always one instance: a second one would send every task twice.
  beat:
    build:
      context: .
      args:
        REQUIREMENTS: standard
        EXTRA_REQUIREMENTS: ${EXTRA_REQUIREMENTS:-}
    profiles: ["standard", "scalable"]
    restart: unless-stopped
    command: ["celery", "-A", "app.modules.tasks.celery_app", "--quiet", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-osnova}:${POSTGRES_PASSWORD:-osnova}@postgres:5432/${POSTGRES_DB:-osnova}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Migrations are the backend's job (RUN_MIGRATIONS in .env, or make migrate):
      # several processes migrating one fresh database at once fail
      RUN_MIGRATIONS: "false"
    # The image health check calls the HTTP API, which beat does not serve
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
