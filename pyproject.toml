# Tool configuration. Dependencies live in requirements/ (one file per module).
[project]
name = "osnova-backend"
version = "0.4.0"
description = "Backend of Osnova — a modular full-stack template (FastAPI)"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses Depends()/File() in argument defaults
