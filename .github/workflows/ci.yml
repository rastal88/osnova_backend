name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    # A real Redis for the shared rate limits (tests/test_rate_limit.py)
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: python -m pytest

  migrations:
    name: Migrations match the models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: osnova
          POSTGRES_PASSWORD: osnova
          POSTGRES_DB: osnova
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://osnova:osnova@localhost:5432/osnova
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Upgrade, check, downgrade
        run: |
          alembic upgrade head
          alembic check
          # strip:begin any — the migration of `make strip` cannot be undone
          alembic downgrade base
          # strip:end

  minimal:
    name: Minimal profile (base requirements only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install base requirements
        run: pip install -r requirements/base.txt

      - name: App starts without optional modules
        run: python -c "from app import app; print(sorted(app.openapi()['paths']))"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        requirements: [base, standard]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg REQUIREMENTS=${{ matrix.requirements }} -t osnova-backend:${{ matrix.requirements }} .

  # strip:begin any — a project that ran `make strip` keeps the modules it uses
  strip:
    name: make strip ${{ matrix.modules }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each flag's modules; auth takes everything that needs it
        modules: [files, notifications, tasks, admin, auth]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: osnova
          POSTGRES_PASSWORD: osnova
          POSTGRES_DB: osnova
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Strip
        run: |
          python -m scripts.strip ${{ matrix.modules }} --apply --yes
          git status --short

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: python -m pytest

      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://osnova:osnova@localhost:5432/osnova
        run: |
          alembic upgrade head
          alembic check

      - name: Requirements and compose files still resolve
        run: |
          pip install --dry-run -q -r requirements/standard.txt
          docker compose -f docker-compose.yml -f docker-compose.datastores.yml --profile standard config -q
  # strip:end

  # strip:begin auth admin files — the check signs in, sends a form and uploads a file
  stack:
    name: Scalable stack (3 replicas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osnova_backend
    env:
      # The S3 bucket of the CI (local files are refused with replicas); make adds the
      # project's compose files after it
      COMPOSE: docker compose -p osnova-ci --project-directory . -f .github/ci/docker-compose.s3.yml
      STACK: docker compose -p osnova-ci --project-directory . -f .github/ci/docker-compose.s3.yml -f docker-compose.yml -f docker-compose.datastores.yml --profile scalable
      ROOT_EMAIL: root@example.com
    steps:
      - uses: actions/checkout@v4
        with:
          path: osnova_backend
      - uses: actions/checkout@v4
        with:
          repository: rastal88/osnova_frontend
          path: osnova_frontend

      - name: Settings
        run: |
          password=$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')
          echo "::add-mask::$password"
          echo "ROOT_PASSWORD=$password" >> "$GITHUB_ENV"
          cat > .env <<EOF
          APP_PROFILE=scalable
          DEBUG=false
          AUTH_ENABLED=true
          ADMIN_ENABLED=true
          FILES_ENABLED=true
          NOTIFICATIONS_ENABLED=true
          BACKGROUND_TASKS_ENABLED=true
          FILES_STORAGE=s3
          S3_ENDPOINT_URL=http://seaweedfs:8333
          S3_BUCKET=osnova
          S3_ACCESS_KEY=ci-access-key
          S3_SECRET_KEY=ci-secret-key
          SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          EOF

      - name: Start (make up-scalable)
        run: make up-scalable

      - name: Migrate, root user, bucket
        run: |
          make migrate
          make createroot ARGS="--email $ROOT_EMAIL --password $ROOT_PASSWORD"
          for attempt in $(seq 30); do
            $STACK exec -T seaweedfs sh -c 'echo "s3.bucket.create -name osnova" | weed shell' >/dev/null 2>&1
            $STACK exec -T seaweedfs sh -c 'echo s3.bucket.list | weed shell' 2>/dev/null | grep -q osnova && break
            sleep 2
          done
          $STACK ps

      - name: Check through the frontend
        run: python3 scripts/check_stack.py http://localhost:8080 --email "$ROOT_EMAIL" --password "$ROOT_PASSWORD" --link-file link.txt

      - name: The file is in the bucket, every replica got requests
        run: |
          link=$(sed -n 1p link.txt)
          network=$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' $($STACK ps -q backend | head -1))
          test "$(docker run --rm --network "$network" curlimages/curl:8.11.1 -sf "$link")" = "$(sed -n 2p link.txt)"
          echo "ok   the download link serves the uploaded content"
          replicas=$($STACK ps -q backend)
          test "$(echo "$replicas" | wc -l)" -eq 3
          for container in $replicas; do
            count=$(docker logs "$container" 2>&1 | grep -c "/api/v1/" || true)
            echo "$(docker inspect -f '{{.Name}}' "$container"): $count API requests"
            test "$count" -gt 0
          done

      - name: Logs
        if: failure()
        run: $STACK logs --tail 80
  # strip:end
