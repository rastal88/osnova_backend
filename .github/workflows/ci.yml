name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: python -m pytest

  minimal:
    name: Minimal profile (base requirements only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install base requirements
        run: pip install -r requirements/base.txt

      - name: App starts without optional modules
        run: python -c "from app import app; print(sorted(app.openapi()['paths']))"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        requirements: [base, standard]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg REQUIREMENTS=${{ matrix.requirements }} -t osnova-backend:${{ matrix.requirements }} .
