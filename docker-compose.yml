name: osnova

# Base compose file — safe for the minimal profile.
#   docker compose -f docker-compose.yml --profile minimal up --build -d
#
# For standard/scalable add the datastore override (see Makefile):
#   docker compose -f docker-compose.yml -f docker-compose.datastores.yml \
#                  --profile standard up --build -d
#
# Requires both repositories checked out side by side:
#   osnova_backend/   <- this file lives here
#   osnova_frontend/

services:
  backend:
    build:
      context: .
      args:
        REQUIREMENTS: base
        # Optional integrations from requirements/, e.g. "sentry" for SENTRY_DSN
        EXTRA_REQUIREMENTS: ${EXTRA_REQUIREMENTS:-}
    profiles: ["minimal", "standard", "scalable"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      # Trust X-Forwarded-For from the frontend proxy, so rate limits see the
      # client IP. Safe while the backend has no published port (see below).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      # Links in emails point to the public site (the frontend proxy)
      FRONTEND_URL: ${SITE_URL:-http://localhost:${FRONTEND_PORT:-8080}}
      # Explicitly empty so the minimal profile never tries to reach a database,
      # regardless of what the local .env contains. The datastore override
      # (standard/scalable) replaces these with in-network service URLs.
      DATABASE_URL: ""
      REDIS_URL: ""
    volumes:
      - uploads_data:/app/uploads
      - forms_data:/app/data
    # No published host port: the API is reached through the frontend proxy
    # (same origin, no CORS), and this keeps the service horizontally scalable.
    expose:
      - "8000"

  frontend:
    build:
      context: ../osnova_frontend
      args:
        VITE_BASE_URL: /api/v1
        # The backend is not running during the build: prerender takes languages
        # from the same .env as the backend
        VITE_SITE_URL: ${SITE_URL:-}
        VITE_LANGUAGES: ${LANGUAGES:-en,ru}
        VITE_DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
        VITE_APP_NAME: ${APP_NAME:-Osnova Application}
        # Empty: no analytics and no cookie banner
        VITE_ANALYTICS_SCRIPT: ${ANALYTICS_SCRIPT:-}
        # More origins the Content Security Policy of the site allows (space-separated)
        CSP_EXTRA_ORIGINS: ${CSP_EXTRA_ORIGINS:-}
        # Error tracking of the frontend (usually its own Sentry project); empty = off
        VITE_SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    profiles: ["minimal", "standard", "scalable"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  uploads_data:
  forms_data:
